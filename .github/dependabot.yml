version: 2
updates:
  # Versão nova só é proposta depois de 7 dias, quando um pacote comprometido
  # costuma já ter sido retirado do repositório público.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
