version: 2
updates:
  # Versão nova só é proposta depois de 7 dias, quando um pacote comprometido
  # costuma já ter sido retirado do repositório público.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Versão principal muda API e entra como migração planejada e testada. Correção de
      # segurança não passa por aqui e continua vindo.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
