name: Portfolio CI

on:
  push:
    branches: [main, "melhorias/**"]
  pull_request:
    branches: [main]

# Menor privilégio: o CI só precisa ler o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run test
      - name: Build (inclui typecheck)
        run: npm run build
