name: Portfolio CI

on:
  push:
    branches: [main, "melhorias/**"]
  pull_request:
    branches: [main]

# Menor privilégio: o CI só precisa ler o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm run test
      - name: Build (inclui typecheck)
        run: npm run build

  gerador:
    name: Gerador em Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes do gerador
        run: mvn -B test
        working-directory: gerador

      # O HTML publicado é versionado, porque a Vercel não tem JVM garantida no
      # build. Isso cria o risco de o gerado sair de sincronia com o gerador,
      # em silêncio: alguém edita o HTML na mão, ou muda o data.ts e esquece de
      # rodar. Gerar aqui e comparar fecha essa porta.
      - name: Gerar e comparar com o que está versionado
        run: |
          npm run gerar
          if ! git diff --quiet -- gerado conteudo; then
            echo "::error::O site gerado não bate com o gerador."
            echo "Rode 'npm run gerar' e faça commit do resultado."
            git diff --stat -- gerado conteudo
            git diff -- gerado conteudo | head -80
            exit 1
          fi
          echo "gerado está em dia"
