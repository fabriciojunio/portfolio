<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FJ">
  <!--
    Mesma marca do avatar do topo do site: iniciais em serifa, com um fio
    embaixo. O fio é o motivo que se repete na página, na régua da coluna do
    texto.

    Caixa alta e não caixa baixa porque, a 16 pixels, o pingo e a descida do
    "j" viram sujeira. Fundo sólido porque a aba do navegador pode ser clara
    ou escura, e a marca precisa se sustentar nas duas: quem garante o
    contraste é o quadrado, não o tema de quem visita.
  -->
  <rect width="64" height="64" rx="8" fill="#0a0a0a"/>
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="36"
    fill="#ffffff"
    letter-spacing="-1.5"
  >FJ</text>
  <rect x="14" y="51" width="36" height="2.5" rx="1.25" fill="#ffffff" opacity="0.85"/>
</svg>
